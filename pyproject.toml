[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sitepack"
version = "0.1.0"
description = "Website static packager – download entire sites for offline browsing and re-hosting"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SitePack Team" }]

dependencies = [
    "PySide6>=6.6,<7",
    "httpx[http2]>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.1,<6",
    "tinycss2>=1.3,<2",
    "playwright>=1.42,<2",
    "aiofiles>=23.2,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pyinstaller>=6.4,<7",
    "ruff>=0.3,<1",
]

[project.scripts]
sitepack = "sitepack.__main__:main"

[project.gui-scripts]
sitepack-gui = "sitepack.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sitepack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
